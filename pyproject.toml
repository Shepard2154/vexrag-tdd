[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vexrag"
description = "A Red Team framework that evaluates RAG functional correctness when the retrieval backend contains poisoned passages."
authors = [
    { name = "Oleg Burnaev", email="john-shepard-2154@yandex.ru" },
]
version = "0.3.0" # TODO: make dynamic
requires-python=">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
   "integration: tests that call real external services",
]
